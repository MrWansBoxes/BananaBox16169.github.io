repository:
  label: "SystemCore Testing GitHub repository"
  url: "https://github.com/wpilibsuite/SystemcoreTesting"

seasons:
  decode:
    description: "During DECODE, thanks to mentor Danny and our experience with the then-current Control Hub, we were selected from thousands of teams worldwide to alpha/beta test FIRST's next-generation control system: the SystemCore and MotionCore, along with the A301 actuator. As we built expertise with the new system, we shared what we learned across the FIRST community."
  biobuzz:
    description: "Thanks to mentor Danny and our experience with the Control Hub, we were selected during DECODE from thousands of teams worldwide to alpha/beta test FIRST's next-generation control system: the SystemCore and MotionCore, along with the A301 actuator. That work is continuing during the 2026–2027 BIOBUZZ season as we build expertise with the new system and share what we learn across the FIRST community."
